<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;font:14px/1.5 system-ui,sans-serif;color:var(--foreground,#203a47)}.controls{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px}label{display:flex;align-items:center;gap:8px}select{font:inherit;color:inherit;background:var(--card,#fff);border:1px solid var(--border,#ccc);border-radius:6px;padding:6px}main{display:grid;grid-template-columns:34% 1fr;gap:16px;align-items:start}figure{margin:0}img{display:block;width:100%;height:auto}figcaption,p{color:var(--muted-foreground,#526976);margin:6px 0 0;font-size:12px}@media(max-width:450px){main{grid-template-columns:1fr}figure:first-child{max-width:220px;margin:auto}}</style></head><body><div class="controls"><label>Screen <select id="screen"><option value="Tahap1Lesson">Lesson path</option><option value="BadgesPage">Badges</option><option value="PenghargaanPage">Appreciation</option></select></label><label>Language <select id="language"><option value="1">English</option><option value="0">Bahasa Melayu</option></select></label></div><main><figure><img id="portrait" alt="Portrait Game view"><figcaption>360 x 800</figcaption></figure><figure><img id="landscape" alt="Landscape Game view"><figcaption>800 x 360</figcaption></figure></main><p>Actual Unity Play-mode captures. Device and child usability testing remain pending.</p><script>const shots={"Tahap1Lesson": {"0": ["Tahap1Lesson-360x800-0.png", "Tahap1Lesson-800x360-0.png"], "1": ["Tahap1Lesson-360x800-1.png", "Tahap1Lesson-800x360-1.png"]}, "BadgesPage": {"0": ["BadgesPage-360x800-0.png", "BadgesPage-800x360-0.png"], "1": ["BadgesPage-360x800-1.png", "BadgesPage-800x360-1.png"]}, "PenghargaanPage": {"0": ["PenghargaanPage-360x800-0.png", "PenghargaanPage-800x360-0.png"], "1": ["PenghargaanPage-360x800-1.png", "PenghargaanPage-800x360-1.png"]}};const screenChoice=document.getElementById('screen'),language=document.getElementById('language');function update(){const pair=shots[screenChoice.value][language.value];document.getElementById('portrait').src=pair[0];document.getElementById('landscape').src=pair[1];}screenChoice.onchange=language.onchange=update;update();</script></body></html>
